<style>
:root{
  --bg:#0D0B1E; --surface:#16132E; --surface2:#1E1A3D; --line:rgba(255,255,255,.11); --ink:#FFFFFF; --muted:#B6ABE6;
  --pink:#FF2E7A; --yellow:#FFC93C; --mint:#00E5A8; --blue:#3FC6FF; --violet:#7C5CFF; --red:#FF5C5C;
  --display:'QSym','Unbounded','Manrope',system-ui,sans-serif; --body:'QSym','Manrope',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:500 16px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-block:18px 60px;min-height:100vh;
  background:radial-gradient(900px 520px at 85% -8%,rgba(124,92,255,.24),transparent 62%),radial-gradient(760px 460px at -12% 108%,rgba(255,46,122,.13),transparent 60%),
  linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px) 0 0/28px 28px,var(--bg);background-attachment:fixed}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button{font-family:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.app{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--violet));font:700 15px var(--display)}
.brand b{display:block;font:700 18px/1.1 var(--display)}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.back{color:var(--muted);text-decoration:none;font-weight:700;font-size:14px}
.xp{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px}
.xp i{font-style:normal;font:700 11px var(--display);padding:6px 10px;border-radius:999px;background:var(--yellow);color:#1b1300;letter-spacing:.04em}
.xp span{font-weight:800;font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs a{flex:none;text-decoration:none;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px}
.tabs a[aria-current="page"]{background:#fff;color:var(--bg);border-color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 22px 44px -26px rgba(0,0,0,.85)}
.kick{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--pink)}
.hero h1{font-size:clamp(26px,5vw,40px);line-height:1.08;margin-top:10px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--pink),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{color:var(--muted);font-weight:600;margin:12px 0 0;max-width:42em}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.tile{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;cursor:pointer;text-align:left}
.tile:hover{border-color:rgba(255,255,255,.3)}
.tile .e{font-size:26px}
.tile b{font:700 15px/1.25 var(--display)}
.tile span{color:var(--muted);font-size:14px}
.label{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:2px 0 10px;display:flex;align-items:center;gap:8px}
.label::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:9px 14px;font-weight:800;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);color:#05131B;border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 20px;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--mint);color:#05140F;box-shadow:0 12px 26px -12px rgba(0,229,168,.65)}
.btn-pink{background:var(--pink);color:#fff}
.btn-yellow{background:var(--yellow);color:#1b1300}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
/* icons (inline SVG, no emoji font needed) */
.ic{width:1.1em;height:1.1em;vertical-align:-.2em;flex:none}
.tabs a .ic{color:var(--pink);margin-right:2px}
.tabs a[aria-current="page"] .ic{color:var(--violet)}
.tile .e{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;color:#D7CCFF;background:linear-gradient(135deg,rgba(124,92,255,.32),rgba(255,46,122,.22));border:1px solid rgba(255,255,255,.12)}
